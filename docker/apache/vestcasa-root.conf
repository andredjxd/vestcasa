# Variante para dominio dedicado (ex: vestcasa.a2teck.com.br), onde a
# app fica na raiz em vez de /vestcasa/ (que so fazia sentido no LXC
# original, que dividia o DocumentRoot com outras coisas).
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/vestcasa

    <Directory /var/www/html/vestcasa>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
